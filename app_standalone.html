<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tiện ích Văn bản Tiếng Việt</title>
    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
    <style>
        :root {
            --primary: #0078d4;
            --primary-hover: #005a9e;
            --bg: #f8f9fa;
            --card: #ffffff;
            --text: #323130;
            --border: #e1dfdd;
            --success: #107c41;
            --error: #d13438;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background: var(--bg); color: var(--text); padding: 12px; font-size: 13px; }
        .header { margin-bottom: 12px; border-bottom: 2px solid var(--primary); padding-bottom: 6px; }
        .header h1 { font-size: 16px; color: var(--primary); }
        .nav { display: flex; gap: 4px; margin-bottom: 12px; }
        .tab-btn { flex: 1; padding: 8px; background: #e1dfdd; border: none; font-weight: 600; cursor: pointer; border-radius: 4px 4px 0 0; }
        .tab-btn.active { background: var(--primary); color: white; }
        .tab-content { display: none; background: var(--card); border: 1px solid var(--border); padding: 12px; border-radius: 4px; }
        .tab-content.active { display: block; }
        .btn { width: 100%; padding: 8px; border: none; border-radius: 4px; background: var(--primary); color: white; font-weight: 600; cursor: pointer; margin-top: 10px; }
        .btn:hover { background: var(--primary-hover); }
        .status { margin-top: 10px; font-weight: 600; font-size: 12px; }
        .success { color: var(--success); }
        .error { color: var(--error); }
        .rules { background: #f3f2f1; padding: 8px; border-radius: 4px; font-size: 11px; margin-bottom: 10px; list-style: none; }
        .input-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px; }
        .input-group input { padding: 6px; border: 1px solid var(--border); border-radius: 4px; }
        table { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 11px; }
        th, td { padding: 6px; border-bottom: 1px solid var(--border); text-align: left; }
        .spell-item { background: #fff4ce; border-left: 3px solid #ffb900; padding: 6px; margin-bottom: 6px; font-size: 11px; }
    </style>
</head>
<body>
    <div class="header">
        <h1>Tiện ích Tiếng Việt</h1>
    </div>

    <div class="nav">
        <button class="tab-btn active" onclick="showTab('tab-date')">📅 Ngày tháng</button>
        <button class="tab-btn" onclick="showTab('tab-abbrev')">🔤 Viết tắt</button>
        <button class="tab-btn" onclick="showTab('tab-spell')">🔍 Chính tả</button>
    </div>

    <!-- TAB NGÀY THÁNG -->
    <div id="tab-date" class="tab-content active">
        <p style="margin-bottom:8px;font-weight:600">Rút ngắn định dạng ngày dài:</p>
        <ul class="rules">
            <li>• ngày 20 tháng 7 năm 2026 ➔ 20/7/2026</li>
            <li>• ngày 20 tháng 7 ➔ ngày 20/7</li>
            <li>• tháng 7 năm 2026 ➔ T7/2026</li>
            <li>• tháng 7 ➔ T7</li>
        </ul>
        <button class="btn" onclick="runFormatDates()">Chuyển đổi ngay</button>
        <div id="dateMsg" class="status"></div>
    </div>

    <!-- TAB VIẾT TẮT -->
    <div id="tab-abbrev" class="tab-content">
        <div class="input-group">
            <input type="text" id="fullInp" placeholder="Cụm từ đầy đủ (VD: Thành phố)">
            <input type="text" id="shortInp" placeholder="Từ viết tắt (VD: TP.)">
            <button class="btn" style="background:#605e5c" onclick="addRule()">+ Thêm từ điển</button>
        </div>
        <table>
            <thead><tr><th>Từ đầy đủ</th><th>Viết tắt</th></tr></thead>
            <tbody id="ruleBody"></tbody>
        </table>
        <button class="btn" onclick="runReplaceAbbrev()">Thay thế viết tắt</button>
        <div id="abbrevMsg" class="status"></div>
    </div>

    <!-- TAB CHÍNH TẢ -->
    <div id="tab-spell" class="tab-content">
        <p style="margin-bottom:8px;font-weight:600">Rà soát chính tả tiếng Việt:</p>
        <button class="btn" onclick="runCheckSpell()">Quét chính tả</button>
        <div id="spellResults" style="margin-top:10px"></div>
    </div>

    <script>
        Office.onReady();

        function showTab(id) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            if (event && event.currentTarget) event.currentTarget.classList.add('active');
        }

        // 1. NGÀY THÁNG
        async function runFormatDates() {
            const msg = document.getElementById('dateMsg');
            msg.className = 'status'; msg.innerText = 'Đang xử lý...';
            try {
                await Word.run(async (context) => {
                    const body = context.document.body;
                    body.load('text');
                    await context.sync();
                    let text = body.text || '';
                    let count = 0;

                    const patterns = [
                        { reg: /ngày\s+(\d{1,2})\s+tháng\s+(\d{1,2})\s+năm\s+(\d{4})/gi, rep: (m,d,mth,y) => `${parseInt(d)}/${parseInt(mth)}/${y}` },
                        { reg: /ngày\s+(\d{1,2})\s+tháng\s+(\d{1,2})/gi, rep: (m,d,mth) => `ngày ${parseInt(d)}/${parseInt(mth)}` },
                        { reg: /tháng\s+(\d{1,2})\s+năm\s+(\d{4})/gi, rep: (m,mth,y) => `T${parseInt(mth)}/${y}` },
                        { reg: /tháng\s+(\d{1,2})/gi, rep: (m,mth) => `T${parseInt(mth)}` }
                    ];

                    for (const p of patterns) {
                        let matches = [];
                        let match;
                        while ((match = p.reg.exec(text)) !== null) {
                            matches.push({ src: match[0], dest: p.rep(...match) });
                        }
                        for (const item of matches) {
                            const res = body.search(item.src, { matchCase: false });
                            res.load('items');
                            await context.sync();
                            for (let i = 0; i < res.items.length; i++) {
                                res.items[i].insertText(item.dest, Word.InsertLocation.replace);
                                count++;
                            }
                        }
                        body.load('text');
                        await context.sync();
                        text = body.text || '';
                    }

                    msg.className = 'status success';
                    msg.innerText = `Thành công! Đã đổi ${count} vị trí.`;
                });
            } catch (e) {
                msg.className = 'status error';
                msg.innerText = 'Lỗi: ' + e.message;
            }
        }

        // 2. TỪ VIẾT TẮT
        let abbrevList = [
            { full: 'Cộng hòa Xã hội Chủ nghĩa Việt Nam', short: 'CHXHCNVN' },
            { full: 'Thành phố', short: 'TP.' },
            { full: 'Ủy ban nhân dân', short: 'UBND' }
        ];

        function renderTable() {
            const tbody = document.getElementById('ruleBody');
            tbody.innerHTML = '';
            abbrevList.forEach(item => {
                tbody.innerHTML += `<tr><td>${item.full}</td><td><strong>${item.short}</strong></td></tr>`;
            });
        }
        renderTable();

        function addRule() {
            const f = document.getElementById('fullInp').value.trim();
            const s = document.getElementById('shortInp').value.trim();
            if (f && s) {
                abbrevList.push({ full: f, short: s });
                renderTable();
                document.getElementById('fullInp').value = '';
                document.getElementById('shortInp').value = '';
            }
        }

        async function runReplaceAbbrev() {
            const msg = document.getElementById('abbrevMsg');
            msg.className = 'status'; msg.innerText = 'Đang xử lý...';
            try {
                await Word.run(async (context) => {
                    const body = context.document.body;
                    let total = 0;
                    for (const rule of abbrevList) {
                        const res = body.search(rule.full, { matchCase: false });
                        res.load('items');
                        await context.sync();
                        for (let i = 0; i < res.items.length; i++) {
                            res.items[i].insertText(rule.short, Word.InsertLocation.replace);
                            total++;
                        }
                    }
                    msg.className = 'status success';
                    msg.innerText = `Đã thay thế ${total} từ viết tắt!`;
                });
            } catch (e) {
                msg.className = 'status error';
                msg.innerText = 'Lỗi: ' + e.message;
            }
        }

        // 3. CHÍNH TẢ
        const spellRules = [
            { err: 'chuẩn đoán', fix: 'chẩn đoán' },
            { err: 'thăm quan', fix: 'tham quan' },
            { err: 'chỉnh chu', fix: 'chỉn chu' },
            { err: 'sơ xuất', fix: 'sơ suất' },
            { err: 'suôn sẽ', fix: 'suôn sẻ' },
            { err: 'xác xuất', fix: 'xác suất' },
            { err: 'xuất xắc', fix: 'xuất sắc' }
        ];

        async function runCheckSpell() {
            const container = document.getElementById('spellResults');
            container.innerHTML = 'Đang quét...';
            try {
                await Word.run(async (context) => {
                    const body = context.document.body;
                    body.load('text');
                    await context.sync();
                    const text = body.text || '';
                    let found = [];

                    for (const r of spellRules) {
                        if (new RegExp(r.err, 'gi').test(text)) {
                            found.push(r);
                        }
                    }

                    if (found.length === 0) {
                        container.innerHTML = '<div class="status success">🎉 Không phát hiện lỗi chính tả nào!</div>';
                        return;
                    }

                    container.innerHTML = `<button class="btn" style="background:#107c41;margin-bottom:8px" onclick="fixAllSpell()">Sửa tất cả ${found.length} lỗi</button>`;
                    found.forEach(item => {
                        container.innerHTML += `<div class="spell-item">Phát hiện: <b>${item.err}</b> ➔ Gợi ý: <b style="color:#107c41">${item.fix}</b></div>`;
                    });
                });
            } catch (e) {
                container.innerHTML = '<div class="status error">Lỗi: ' + e.message + '</div>';
            }
        }

        async function fixAllSpell() {
            try {
                await Word.run(async (context) => {
                    const body = context.document.body;
                    let count = 0;
                    for (const r of spellRules) {
                        const res = body.search(r.err, { matchCase: false });
                        res.load('items');
                        await context.sync();
                        for (let i = 0; i < res.items.length; i++) {
                            res.items[i].insertText(r.fix, Word.InsertLocation.replace);
                            count++;
                        }
                    }
                    document.getElementById('spellResults').innerHTML = `<div class="status success">🎉 Đã sửa xong ${count} lỗi chính tả!</div>`;
                });
            } catch (e) {
                alert('Lỗi: ' + e.message);
            }
        }
    </script>
</body>
</html>
